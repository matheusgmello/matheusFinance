version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: matheusfinance-db
    environment:
      POSTGRES_DB: matheusfinance
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_pass
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d matheusfinance"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matheusfinance-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/matheusfinance
      SPRING_DATASOURCE_USERNAME: finance_user
      SPRING_DATASOURCE_PASSWORD: finance_pass
      APP_MASTER_KEY: ${APP_MASTER_KEY:-changeme123}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8085:8085"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matheusfinance-ui
    environment:
      VITE_API_URL: http://localhost:8085
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
