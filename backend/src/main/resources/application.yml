spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/matheusfinance
    username: finance_user
    password: finance_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    defer-datasource-initialization: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
  backup:
    dir: "./backups"
    cron: "0 0 3 * * *"
    retencao-dias: 30
  jwt:
    secret: "${JWT_SECRET:mf-local-dev-secret-only-troque-em-producao}"
    expiration-days: 7
    setup-expiration-minutes: 10
  vapid:
    # Gere em: https://vapidkeys.com/ ou via openssl ecparam + openssl ec
    public-key: "${VAPID_PUBLIC_KEY:}"
    subject: "${VAPID_SUBJECT:mailto:admin@matheusfinance.app}"

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info
